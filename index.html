<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER &mdash; Enrollment Report Generator</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Enrollment Report Generator</h1>
            <p class="subtitle">Drop your enrollment and crosslist CSV files to generate formatted reports</p>
        </header>

        <div id="dropzone" class="dropzone">
            <div id="dropzone-prompt" class="dropzone-prompt">
                <div class="dropzone-icon">&#128462;</div>
                <p class="dropzone-text">Drag &amp; drop CSV files here</p>
                <p class="dropzone-subtext">or click to browse</p>
            </div>
            <div id="file-list" class="file-list hidden"></div>
            <input type="file" id="file-input" multiple accept=".csv,.txt" hidden>
        </div>

        <div id="term-status-area" class="term-status-area hidden"></div>
        <div id="error-area" class="error-area hidden"></div>

        <div class="actions">
            <button id="clear-btn" class="btn btn-secondary hidden">Clear</button>
            <button id="generate-btn" class="btn btn-primary" disabled>Generate Reports</button>
        </div>

        <div id="progress-area" class="progress-area hidden">
            <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
            <p id="progress-text" class="progress-text">Generating...</p>
        </div>

        <div id="downloads-area" class="downloads-area hidden"></div>

        <footer>ER v1.0</footer>
    </div>

    <script src="js/processor.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
